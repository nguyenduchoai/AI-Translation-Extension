name: Verify Windows VieNeu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'companion/**'
      - 'scripts/*windows*.ps1'
      - '.github/workflows/windows-vieneu.yml'
  workflow_call:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install uv
        run: python -m pip install uv
      - name: Test BAT setup, repeat startup and errors
        shell: powershell
        run: .\scripts\test-windows-launcher.ps1
      - name: Run BAT with real VieNeu model and synthesize audio
        shell: powershell
        run: .\scripts\verify-windows-vieneu.ps1
