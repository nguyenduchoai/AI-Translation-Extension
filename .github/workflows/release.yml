name: Package extension release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  windows-vieneu:
    uses: ./.github/workflows/windows-vieneu.yml
  release:
    needs: windows-vieneu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install lightweight companion test dependencies
        run: python -m pip install fastapi==0.135.1 starlette==1.7.0 httpx==0.28.1 numpy==2.5.3
      - name: Test companion API without downloading models
        run: python -m unittest discover -s companion -p 'test_*.py'
      - name: Run tests
        run: node --test
      - name: Package runtime files and verify release version
        run: python3 scripts/package-extension.py --tag "$GITHUB_REF_NAME"
      - name: Package optional VieNeu companion
        run: python3 scripts/package-companion.py --tag "$GITHUB_REF_NAME"
      - name: Publish downloadable ZIP and SHA-256 checksum
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 --clobber
          else
            notes_file="docs/release-${GITHUB_REF_NAME}.md"
            notes_args=(--generate-notes)
            if [ -f "$notes_file" ]; then
              notes_args=(--notes-file "$notes_file")
            fi
            gh release create "$GITHUB_REF_NAME" dist/*.zip dist/*.sha256 \
              --verify-tag --title "AI Screen Translator $GITHUB_REF_NAME" "${notes_args[@]}"
          fi
